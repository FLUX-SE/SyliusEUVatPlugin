name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths-ignore:
            - "docs/**"
            - "*.md"
    pull_request:
        paths-ignore:
            - "docs/**"
            - "*.md"
    release:
        types: [created]
    schedule:
        - cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

jobs:
    static-checks:
        runs-on: ubuntu-latest

        name: "Static checks (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})"

        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.2, 8.3, 8.4 ]
                symfony: [ ^6.4, ^7.4 ]

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    ini-values: date.timezone=Europe/Paris, opcache.enable=1, opcache.enable_cli=0, opcache.memory_consumption=512, opcache.max_accelerated_files=65407, opcache.interned_strings_buffer=8, opcache.validate_timestamps=0, opcache.save_comments=1, opcache.fast_shutdown=0
                    extensions: intl, gd, opcache, mysql, pdo_mysql
                    tools: flex,symfony
                    coverage: none

            -
                name: Configure global composer
                if: matrix.symfony != ''
                run: |
                    composer global config --no-plugins allow-plugins.symfony/flex true
                    composer global require --no-progress --no-scripts --no-plugins "symfony/flex"
            -
                name: Get Composer cache directory
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                id: composer-cache

            -
                name: Cache Composer
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
                    restore-keys: |
                        ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            -
                name: Install PHP dependencies
                run: composer update --no-interaction --no-scripts
                env:
                    SYMFONY_REQUIRE: ${{ matrix.symfony }}
                id: end-of-setup

            -
                name: Validate composer.json
                run: composer validate --strict --no-check-version
                if: always() && steps.end-of-setup.outcome == 'success'

            -
                name: Check for security vulnerabilities
                run: symfony security:check
                if: always() && steps.end-of-setup.outcome == 'success'

            -
                name: Validate Yaml files
                run: vendor/bin/yaml-lint src
                if: always() && steps.end-of-setup.outcome == 'success'

            -
                name: Container lint
                run: vendor/bin/console lint:container
                env:
                    APP_ENV: test
                if: always() && steps.end-of-setup.outcome == 'success'

            -
                name: Run ECS
                run: vendor/bin/ecs check src
                if: always() && steps.end-of-setup.outcome == 'success'

            -
                name: Run PHPStan
                run: vendor/bin/phpstan analyse
                if: always() && steps.end-of-setup.outcome == 'success'
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"

        strategy:
            fail-fast: false
            matrix:
                php: [8.2, 8.3, 8.4]
                symfony: [^6.4, ^7.4]
                sylius: [~2.0.0, ~2.1.0, ~2.2.0]
                mysql: [5.7, 8.0]
                exclude:
                    -   sylius: ~2.2.0
                        symfony: ^6.4
        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Restrict Sylius version
                if: matrix.sylius != ''
                run: |
                    composer require "sylius/sylius:${{ matrix.sylius }}" --dev --no-update --no-scripts --no-interaction
                    composer require "sylius/core-bundle:${{ matrix.sylius }}" --no-update --no-scripts --no-interaction

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@v4
                with:
                    build_type: plugin
                    e2e_js: "yes"
                    php_version: "${{ matrix.php }}"
                    symfony_version: "${{ matrix.symfony }}"
                    sylius_version: "${{ matrix.sylius }}"
                    node_version: "20.x"
                    chrome_version: stable
                    database: "mysql:${{ matrix.mysql }}"

            -
                name: Run PHPUnit
                run: vendor/bin/phpunit --colors=always

            -
                name: Run Behat
                env:
                    PANTHER_NO_SANDBOX: "1"
                    PANTHER_CHROME_ARGUMENTS: "--disable-dev-shm-usage"
                run: vendor/bin/behat --colors --strict -vvv --no-interaction || vendor/bin/behat --colors --strict -vvv --no-interaction --rerun

            -
                name: Upload Behat logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Behat logs - Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"
                    path: etc/build/
                    if-no-files-found: ignore
